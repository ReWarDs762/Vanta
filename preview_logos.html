<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body { background: #1a1a1a; font-family: monospace; color: #888; padding: 40px; display: flex; flex-direction: column; gap: 40px; }
  .label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; color: #555; }
  .box { display: inline-block; }
  img { display: block; }
</style>
</head>
<body>
  <div class="box">
    <div class="label">server_icon.png — 96×96</div>
    <img src="server_icon.png" width="96" height="96">
  </div>
  <div class="box">
    <div class="label">banner_detail.png — 900×200</div>
    <img src="banner_detail.png" width="900" height="200">
  </div>
  <div class="box">
    <div class="label">banner_connecting.png — 1280×720</div>
    <img src="banner_connecting.png" style="width:900px;height:auto">
  </div>
</body>
</html>
