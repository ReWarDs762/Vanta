# ═══════════════════════════════════════════════════════════════════════════
#   VANTA — Permissions spooner
#
#   POURQUOI CE FICHIER EXISTE À LA RACINE DU DÉPÔT
#   ---------------------------------------------------------------------
#   `resources/[menu]/spooner/` est un clone de github.com/kibook/spooner,
#   donc un dépôt git imbriqué, donc exclu par `.gitignore` (git ne saurait
#   en stocker que la référence : un clone du dépôt VANTA récupérerait un
#   dossier vide et `ensure spooner` échouerait).
#
#   Conséquence découverte à l'audit du 03/09/2026 : le durcissement des
#   permissions fait le 23/08/2026 vivait dans le `permissions.cfg` du dossier
#   ignoré, donc SUR LE DISQUE LOCAL UNIQUEMENT. Pire, la procédure de
#   restauration (`audit-initial.md`, annexe A) fait re-cloner le dépôt
#   d'origine, dont le `permissions.cfg` ouvre `spooner.*` à
#   `builtin.everyone` — n'importe quel joueur connecté peut alors spawner,
#   modifier et SUPPRIMER des entités, y compris celles des autres joueurs.
#   Autrement dit : la procédure de restauration réintroduisait la faille.
#
#   Ce fichier-ci est versionné, il fait donc partie du dépôt et survit à
#   toute restauration. `server.cfg` l'exécute À LA PLACE du `permissions.cfg`
#   d'origine, qui ne doit plus jamais être `exec`'d.
#
#   ⚠️ Ne pas remettre `exec resources/[menu]/spooner/permissions.cfg` dans
#      `server.cfg` : ses règles entreraient en concurrence avec celles-ci.
# ═══════════════════════════════════════════════════════════════════════════

# Tout l'arbre `spooner.*` (spawn, modify, delete, attach, freeze, database,
# import/export, godmode, noclip, météo, heure...) réservé aux admins.
# Cibler l'objet racine couvre l'ensemble des sous-permissions, sans avoir à
# maintenir la liste exacte des ACE déclarés en amont — elle change d'une
# version de spooner à l'autre.
add_ace group.admin spooner allow

# Refus explicite pour tout le monde. Un joueur ordinaire n'hérite d'aucune
# permission spooner ; `group.admin` étant un principal plus spécifique que
# `builtin.everyone`, la règle ci-dessus continue de s'appliquer aux admins.
add_ace builtin.everyone spooner deny

# Rappel : les comptes admin doivent être présents dans `group.admin` via
# `add_principal` dans `server.cfg`. Sans ça, plus personne n'a accès à
# spooner — c'est le point D2 de `ROADMAP.md`.
