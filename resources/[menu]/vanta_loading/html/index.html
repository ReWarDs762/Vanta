<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTA — Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fond -->
    <div class="bg"></div>
    <div class="bg-grid"></div>
    <div class="bg-line"></div>

    <!-- Coins décoratifs -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Centre -->
    <div class="wrapper">

        <!-- Logo -->
        <div class="logo-zone">
            <div class="logo-mark">
                                <!-- Marque VANTA : chevron descendant, jonctions à onglet,
                     extrémités carrées. Identique à l'icône serveur et aux NUI. -->
                <svg viewBox="0 0 44 36" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 2 L22 34 L42 2" fill="none" stroke="#c8cdd4" stroke-width="6"
                          stroke-linecap="square" stroke-linejoin="miter"/>
                </svg>
            </div>
            <div class="logo-name">VANTA</div>
            <div class="logo-sub">Zombie Survival — PVP</div>
        </div>

        <!-- Progression -->
        <div class="progress-zone">
            <div class="progress-header">
                <span class="progress-label">Chargement</span>
                <span class="progress-pct" id="pct">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="fill"></div>
            </div>
            <div class="progress-step" id="step">Initialisation...</div>
        </div>

    </div>

    <!-- Bas de page -->
    <div class="h-line"></div>
    <div class="bottom-zone">
        <div class="bottom-left">
            <span class="bottom-tag">Serveur</span>
            <span class="bottom-val">VANTA — FR</span>
        </div>
        <div class="bottom-right">
            <span class="bottom-tag">Saison</span>
            <span class="bottom-val">Saison 1</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
