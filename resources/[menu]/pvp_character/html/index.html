<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nui://vanta_ui/html/vanta.css">
    <link rel="stylesheet" href="style.css">
    <title>VANTA — Création de personnage</title>
</head>
<body>
    <div id="overlay" class="hidden">

        <!-- Vignette d'ombrage latéral pour poser le ped visuellement à droite -->
        <div id="vignette-left"></div>

        <!-- Panel de création (gauche) -->
        <aside id="panel">

            <header id="header">
                <div class="brand">VANTA</div>
                <h1 class="title">CRÉATION DE PERSONNAGE</h1>
                <p class="subtitle">Configure ton identité avant d'entrer dans la zone</p>
            </header>

            <!-- Pseudo -->
            <section class="section">
                <label class="field-label" for="pseudo-input">PSEUDO</label>
                <input
                    type="text"
                    id="pseudo-input"
                    placeholder="Ton pseudo..."
                    maxlength="20"
                    autocomplete="off"
                    spellcheck="false"
                >
                <div class="field-hint" id="pseudo-hint">2–20 caractères</div>
            </section>

            <!-- Genre -->
            <section class="section">
                <label class="field-label">GENRE</label>
                <div class="gender-grid">
                    <div class="gender-card" id="card-male" data-gender="male">
                        <svg class="gender-icon" viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M4 55V37C4 29.82 11.16 24 20 24C28.84 24 36 29.82 36 37V55" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
                        </svg>
                        <span class="gender-label">HOMME</span>
                    </div>
                    <div class="gender-card" id="card-female" data-gender="female">
                        <svg class="gender-icon" viewBox="0 0 40 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M7 55V39C7 32.37 12.93 27 20 27C27.07 27 33 32.37 33 39V55" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
                            <path d="M11 33L8 46M29 33L32 46" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/>
                        </svg>
                        <span class="gender-label">FEMME</span>
                    </div>
                </div>
            </section>

            <!-- Couleur de peau -->
            <section class="section">
                <label class="field-label">COULEUR DE PEAU</label>
                <div class="swatch-grid">
                    <div class="swatch" data-skin="0" style="--tone:#f1c6a4;"><span class="swatch-dot"></span></div>
                    <div class="swatch" data-skin="1" style="--tone:#c69277;"><span class="swatch-dot"></span></div>
                    <div class="swatch" data-skin="2" style="--tone:#8a5a3f;"><span class="swatch-dot"></span></div>
                    <div class="swatch" data-skin="3" style="--tone:#4d2e20;"><span class="swatch-dot"></span></div>
                </div>
            </section>

            <!-- Cheveux -->
            <section class="section">
                <label class="field-label">CHEVEUX</label>
                <div class="hair-grid">
                    <div class="hair-card" data-hair="0"><span>01</span></div>
                    <div class="hair-card" data-hair="1"><span>02</span></div>
                    <div class="hair-card" data-hair="2"><span>03</span></div>
                    <div class="hair-card" data-hair="3"><span>04</span></div>
                </div>
            </section>

            <!-- Confirm / Error -->
            <div class="footer">
                <div id="error-msg" class="error-msg"></div>
                <button id="confirm-btn" disabled>CONFIRMER</button>
            </div>

        </aside>

    </div>
    <script src="app.js"></script>
</body>
</html>
