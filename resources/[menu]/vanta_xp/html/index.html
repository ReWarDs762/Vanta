<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTA — Progression</title>
    <link rel="stylesheet" href="nui://vanta_ui/html/vanta.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlay pour clic extérieur -->
    <div id="overlay" class="overlay hidden" onclick="closePanel()"></div>

    <!-- Panel principal -->
    <div id="xpPanel" class="xp-panel hidden v-brackets">
        <i class="v-sweep"></i>
        <i class="v-brackets-alt"></i>

        <!-- Section haute : identité + niveau -->
        <div class="section-top">
            <div class="panel-eyebrow">
                <span class="v-mark v-mark-sm v-mark-dim"></span>
                <span>VANTA · PROGRESSION</span>
            </div>
            <div id="prestigeBadge" class="prestige-badge"></div>
            <div id="levelDisplay" class="level-display">LVL 1</div>
            <div id="totalXP" class="total-xp">0 XP total</div>
        </div>

        <!-- Section milieu : Barre XP -->
        <div class="section-mid">
            <div class="xp-head">
                <span class="xp-head-label">EXPÉRIENCE</span>
                <span id="xpPercent" class="xp-percent">0%</span>
            </div>
            <div class="xp-bar-container">
                <div id="xpBar" class="xp-bar" style="width: 0%"></div>
            </div>
            <div class="xp-labels">
                <span id="xpCurrent">0</span>
                <span id="xpNext">/ 0 XP</span>
            </div>
            <button id="prestigeBtn" class="prestige-btn hidden" onclick="doPrestige()">
                PASSER AU PRESTIGE
            </button>
        </div>

        <!-- Section bas : Capacités (blocs chiffres VANTA) -->
        <div class="section-bottom">
            <div class="capacity-block">
                <div class="capacity-label">SAC</div>
                <div id="bagCapacity" class="capacity-value">50kg</div>
            </div>
            <div class="capacity-block">
                <div class="capacity-label">CONTENEUR</div>
                <div id="contCapacity" class="capacity-value">20kg</div>
            </div>
        </div>

        <!-- Section prestiges : paliers en ligne -->
        <div class="section-prestiges">
            <div class="prestiges-head v-title">
                <span class="v-title-text">PRESTIGE</span>
            </div>
            <div class="prestiges-row" id="prestigesRow"></div>
        </div>

    </div>

    <!-- Notifications (toasts) -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Notification prestige (centré) -->
    <div id="prestigeNotif" class="prestige-notif hidden"></div>

    <script src="script.js"></script>
</body>
</html>
