<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>VANTA HUD</title>
  <link rel="stylesheet" href="nui://vanta_ui/html/vanta.css"/>
  <style>
    /* ═══════════════════════════════════════════════════════════
       VANTA HUD — surface la plus vue du serveur.
       Design System : vanta.css v2.1 (nui://vanta_ui/html/vanta.css)
       Signatures présentes : chevron de marque, filet supérieur,
       équerre d'angle, bloc chiffre (munitions).
       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      overflow: hidden;
      font-family: var(--v-font, 'Inter', sans-serif);
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ── CONTENEUR PRINCIPAL ── */
    #hud {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.3s ease;
      min-width: 214px;
    }
    #hud.visible { opacity: 1; }

    /* ── BLOC GÉNÉRIQUE ── */
    .hud-block {
      position: relative;
      background: rgba(10, 10, 10, 0.82);
      border: 1px solid var(--v-border);
      border-radius: var(--v-radius-xs);
      padding: 10px 14px;
    }

    /* Filet argenté supérieur — signature VANTA, ici en version fixe
       (le HUD est permanent : pas d'animation qui rejouerait sans cesse). */
    .hud-block::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 46%;
      height: 1px;
      background: linear-gradient(90deg, var(--v-silver-dim), transparent);
      pointer-events: none;
    }

    /* Équerre bas-droite — rappel du cadre VANTA */
    .hud-block::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 10px; height: 10px;
      border-bottom: 1px solid var(--v-bracket-color);
      border-right: 1px solid var(--v-bracket-color);
      pointer-events: none;
    }

    /* ── STATS (HP + ARMOR) ── */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-row + .stat-row { margin-top: 8px; }

    .stat-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: var(--v-track-title);
      text-transform: uppercase;
      color: var(--v-text-tertiary);
      width: 42px;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 2px;
      background: var(--v-separator-bold);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.25s ease, background 0.25s ease;
    }

    .hp-fill    { background: var(--v-silver); }
    .armor-fill { background: var(--v-silver-dim); }

    .stat-value {
      font-size: 11px;
      font-weight: 600;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
      color: var(--v-silver);
      font-variant-numeric: tabular-nums;
      letter-spacing: var(--v-track-meta);
    }

    /* HP critique — signal PVP */
    .hp-fill.critical    { background: var(--v-pvp); }
    .stat-value.critical { color: var(--v-pvp); }

    @keyframes hp-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }
    .hp-critical .stat-value { animation: hp-pulse 0.7s infinite; }

    /* ── LIGNE ARME + MUNITIONS ── */
    .weapon-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 2px;
    }

    #weapon-name {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: var(--v-track-title);
      text-transform: uppercase;
      color: var(--v-text-tertiary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s ease;
    }
    #weapon-name.armed { color: var(--v-silver); }

    /* Munitions — bloc chiffre VANTA (Inter Light, tabulaire) */
    #ammo-display {
      display: none;
      align-items: baseline;
      gap: 2px;
      flex-shrink: 0;
    }

    #ammo-current {
      font-size: 18px;
      font-weight: 300;
      color: var(--v-text);
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #ammo-sep {
      font-size: 10px;
      color: var(--v-text-disabled);
      margin: 0 1px;
    }

    #ammo-reserve {
      font-size: 11px;
      font-weight: 400;
      color: var(--v-text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    /* Munitions basses — signal PVP */
    @keyframes ammo-blink {
      0%, 100% { color: var(--v-pvp); }
      50%      { color: rgba(232, 86, 75, 0.30); }
    }
    #ammo-current.ammo-low { animation: ammo-blink 0.75s infinite; }

    /* Munitions infinies */
    #ammo-inf {
      display: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: var(--v-track-label);
      color: var(--v-text-tertiary);
    }

    /* ── FLASH DÉGÂTS ── */
    #dmg-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(232, 86, 75, 0.16) 100%);
      opacity: 0;
      transition: opacity 0.08s ease;
    }
    #dmg-flash.active { opacity: 1; }

    /* ── SÉPARATEUR INTERNE ── */
    .h-sep {
      width: 100%;
      height: 1px;
      background: var(--v-separator);
      margin: 8px 0 6px;
    }

    /* ── NOTIFICATION GRÂCE ZONE SAFE ── */
    #grace-notice {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid var(--v-border);
      border-left: 2px solid var(--v-success);
      border-radius: var(--v-radius-xs);
      padding: 10px 14px 8px;
      min-width: 172px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #grace-notice.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .grace-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: var(--v-track-title);
      text-transform: uppercase;
      color: var(--v-text-tertiary);
      margin-bottom: 5px;
    }
    /* Chevron de marque en tête de notification */
    .grace-label::before {
      content: '';
      width: 8px; height: 7px;
      background-color: var(--v-success);
      -webkit-mask: var(--v-mark-svg) center / contain no-repeat;
              mask: var(--v-mark-svg) center / contain no-repeat;
    }

    .grace-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .grace-text {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: var(--v-track-title);
      text-transform: uppercase;
      color: var(--v-text-secondary);
    }

    #grace-timer {
      font-size: 20px;
      font-weight: 300;
      color: var(--v-success);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .grace-bar-track {
      margin-top: 8px;
      width: 100%;
      height: 1px;
      background: var(--v-separator);
    }

    #grace-bar {
      height: 100%;
      background: var(--v-success);
      transition: width 0.08s linear;
    }
  </style>
</head>
<body>

<div id="dmg-flash"></div>

<div id="grace-notice">
  <div class="grace-label">ZONE SAFE</div>
  <div class="grace-row">
    <span class="grace-text">IMMUNITÉ</span>
    <span id="grace-timer">3s</span>
  </div>
  <div class="grace-bar-track">
    <div id="grace-bar" style="width:100%"></div>
  </div>
</div>

<div id="hud">

  <!-- Bloc HP + Armor + Arme fusionnés -->
  <div class="hud-block">

    <!-- HP -->
    <div class="stat-row" id="hp-row">
      <span class="stat-label">VIE</span>
      <div class="bar-track">
        <div class="bar-fill hp-fill" id="hp-bar" style="width:100%"></div>
      </div>
      <span class="stat-value" id="hp-val">100</span>
    </div>

    <!-- Armor -->
    <div class="stat-row" id="armor-row">
      <span class="stat-label">ARMOR</span>
      <div class="bar-track">
        <div class="bar-fill armor-fill" id="armor-bar" style="width:0%"></div>
      </div>
      <span class="stat-value" id="armor-val">0</span>
    </div>

    <div class="h-sep"></div>

    <!-- Arme + Munitions -->
    <div class="weapon-row">
      <span id="weapon-name">AUCUNE ARME</span>
      <div id="ammo-display">
        <span id="ammo-current">0</span>
        <span id="ammo-sep">/</span>
        <span id="ammo-reserve">0</span>
      </div>
      <span id="ammo-inf">∞</span>
    </div>

  </div>

</div>

<script>
  const hud         = document.getElementById('hud');
  const hpBar       = document.getElementById('hp-bar');
  const hpVal       = document.getElementById('hp-val');
  const hpRow       = document.getElementById('hp-row');
  const armorBar    = document.getElementById('armor-bar');
  const armorVal    = document.getElementById('armor-val');
  const weaponName  = document.getElementById('weapon-name');
  const ammoDisplay = document.getElementById('ammo-display');
  const ammoCurrent = document.getElementById('ammo-current');
  const ammoReserve = document.getElementById('ammo-reserve');
  const ammoInf     = document.getElementById('ammo-inf');
  const dmgFlash    = document.getElementById('dmg-flash');

  let flashTimer = null;

  function setHP(val) {
    const pct = Math.max(0, Math.min(100, val));
    hpBar.style.width = pct + '%';
    hpVal.textContent = Math.round(pct);
    const crit = pct <= 25;
    hpBar.classList.toggle('critical', crit);
    hpVal.classList.toggle('critical', crit);
    hpRow.classList.toggle('hp-critical', crit);
  }

  function setArmor(val) {
    const pct = Math.max(0, Math.min(100, val));
    armorBar.style.width = pct + '%';
    armorVal.textContent = Math.round(pct);
  }

  function setWeapon(name, ammo, reserve) {
    if (!name || name === '' || name === 'UNARMED') {
      weaponName.textContent = 'AUCUNE ARME';
      weaponName.classList.remove('armed');
      ammoDisplay.style.display = 'none';
      ammoInf.style.display = 'none';
    } else {
      weaponName.textContent = name.toUpperCase();
      weaponName.classList.add('armed');
      if (ammo === -1) {
        // Arme de mêlée ou munitions infinies
        ammoDisplay.style.display = 'none';
        ammoInf.style.display = 'block';
      } else {
        ammoDisplay.style.display = 'flex';
        ammoInf.style.display = 'none';
        ammoCurrent.textContent = ammo;
        ammoReserve.textContent = reserve > 0 ? reserve : '∞';
        ammoCurrent.classList.toggle('ammo-low', ammo <= 5 && ammo > 0);
      }
    }
  }

  function triggerDamageFlash() {
    dmgFlash.classList.add('active');
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(() => dmgFlash.classList.remove('active'), 180);
  }

  // ── Grace zone safe ──────────────────────────────────────────────────────
  const graceNotice = document.getElementById('grace-notice');
  const graceTimerEl = document.getElementById('grace-timer');
  const graceBarEl   = document.getElementById('grace-bar');
  let graceRaf = null;
  let graceStart = 0;
  let graceDuration = 3000;

  function updateGrace() {
    const elapsed = Date.now() - graceStart;
    const remaining = Math.max(0, graceDuration - elapsed);
    const pct = (remaining / graceDuration) * 100;

    graceTimerEl.textContent = Math.ceil(remaining / 1000) + 's';
    graceBarEl.style.width = pct + '%';

    if (remaining <= 0) {
      graceNotice.classList.remove('visible');
      graceRaf = null;
      return;
    }
    graceRaf = requestAnimationFrame(updateGrace);
  }

  function showGrace(durationSec) {
    if (graceRaf) cancelAnimationFrame(graceRaf);
    graceDuration = durationSec * 1000;
    graceStart    = Date.now();
    graceTimerEl.textContent = durationSec + 's';
    graceBarEl.style.width   = '100%';
    graceNotice.classList.add('visible');
    graceRaf = requestAnimationFrame(updateGrace);
  }

  window.addEventListener('message', function(e) {
    const d = e.data;
    if (d.type === 'show')   { hud.classList.toggle('visible', d.show); }
    if (d.type === 'update') {
      if (d.hp     !== undefined) setHP(d.hp);
      if (d.armor  !== undefined) setArmor(d.armor);
      if (d.weapon !== undefined) setWeapon(d.weapon, d.ammo ?? 0, d.reserve ?? 0);
    }
    if (d.type === 'damage')     { triggerDamageFlash(); }
    if (d.type === 'graceStart') { showGrace(d.duration); }
  });

  hud.classList.add('visible');
</script>
</body>
</html>
