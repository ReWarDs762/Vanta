<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PVP Garage</title>
    <link rel="stylesheet" href="nui://vanta_ui/html/vanta.css"/>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dealer.css" />
</head>
<body>

    <!-- ══ MECHANIC PANEL (personnalisation) ══ -->
    <div id="mechanic-panel" class="panel hidden">
        <div class="panel-header">
            <span class="panel-title">PERSONNALISATION</span>
            <div class="panel-actions">
                <button class="btn-cancel" id="btn-cancel-mech">ANNULER</button>
                <button class="btn-confirm" id="btn-confirm-mech">CONFIRMER</button>
            </div>
        </div>
        <div class="panel-body">
            <div class="sidebar" id="mech-sidebar"></div>
            <div class="content" id="mech-content"></div>
        </div>
    </div>

    <!-- ══ GARAGE DEALER (achat / vente véhicules) ══ -->
    <div id="garage-dealer" style="display:none">

        <!-- LEFT : catalogue -->
        <div id="gd-left">
            <div id="gd-vendor-header">
                <h2 id="gd-title">CONCESSIONNAIRE</h2>
                <span id="gd-balance">Solde : $0</span>
            </div>

            <div id="gd-mode-tabs">
                <button class="gd-tab active" data-mode="buy">ACHETER</button>
                <button class="gd-tab"        data-mode="sell">VENDRE</button>
            </div>

            <div id="gd-toolbar">
                <div id="gd-search-wrap">
                    <input type="text" id="gd-search" placeholder="Rechercher..." autocomplete="off" />
                    <span class="gd-srch-icon">&#9906;</span>
                </div>
                <div id="gd-filter-wrap">
                    <select id="gd-filter">
                        <option value="">Tous</option>
                    </select>
                    <span class="gd-filter-arr">&#9660;</span>
                </div>
            </div>

            <div id="gd-buy-grid"  class="gd-grid"></div>
            <div id="gd-sell-grid" class="gd-grid" style="display:none"></div>
        </div>

        <!-- RIGHT : panier / vente -->
        <div id="gd-right">

            <!-- Panneau PANIER (buy) -->
            <div id="gd-buy-panel">
                <div id="gd-cart-header">
                    <h3>PANIER</h3>
                    <p>Contenu du panier</p>
                </div>
                <div id="gd-cart-content">
                    <div id="gd-cart-empty">VOTRE PANIER EST VIDE.</div>
                    <div id="gd-cart-items"></div>
                </div>
                <div id="gd-buy-footer">
                    <div class="gd-total-row">
                        <span>Montant du panier :</span>
                        <span id="gd-cart-total">$0</span>
                    </div>
                    <button id="gd-btn-buy"   class="gd-btn-primary"   disabled>Acheter</button>
                    <button id="gd-btn-stash" class="gd-btn-primary"   disabled>Acheter → Coffre protégé</button>
                    <button id="gd-btn-close" class="gd-btn-secondary" onclick="gdClose()">Retour</button>
                </div>
            </div>

            <!-- Panneau VENTE (sell) -->
            <div id="gd-sell-panel" style="display:none">
                <div id="gd-sell-select-area">
                    <div id="gd-sell-hint">Sélectionnez un véhicule<br>pour voir le prix de vente</div>
                    <div id="gd-sell-detail" style="display:none">
                        <div id="gd-sell-img-wrap"></div>
                        <div id="gd-sell-item-name">—</div>
                        <div id="gd-sell-price-label">Prix de vente</div>
                        <div id="gd-sell-item-price">$0</div>
                        <div id="gd-sell-ratio-note">50% du prix d'achat</div>
                    </div>
                </div>
                <div id="gd-sell-footer">
                    <div class="gd-total-row">
                        <span>Prix de vente :</span>
                        <span id="gd-sell-total">$0</span>
                    </div>
                    <button id="gd-btn-sell-confirm" class="gd-btn-green"     disabled>Vendre</button>
                    <button id="gd-btn-sell-all"     class="gd-btn-green"     disabled>Vendre tout</button>
                    <button id="gd-btn-sell-close"   class="gd-btn-secondary" onclick="gdClose()">Retour</button>
                </div>
            </div>

        </div>
    </div><!-- /garage-dealer -->

    <div id="gd-toast"></div>

    <script src="app.js"></script>
</body>
</html>
